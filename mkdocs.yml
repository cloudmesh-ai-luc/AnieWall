site_name: AnieWall Documentation
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Project Report: project/project.md
  - Architecture: architecture.md
  - Security and Privacy: security.md
  - Shared Contributions: contributions.md

