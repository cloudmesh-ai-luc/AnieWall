[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-native-biometric-consent-audit"
version = "0.1.0"
description = "Cloud-native biometric consent and audit platform for the Cloud Computing, DevOps, and AI course project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "black",
    "flake8",
]

docs = [
    "mkdocs",
    "mkdocs-material",
]

[tool.setuptools.packages.find]
where = ["src"]
