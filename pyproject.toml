[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AnieWall"
version = "0.1.0"
description = "AnieWall project documentation and assignments"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "mkdocs",
    "mkdocs-material",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
]
